_config_version: 50
advertised_toolsets:
- web
- browser
- x_search
- image_gen
- video_gen
- tts
- todo
- a2a
- kanban
- memory
- delegation
custom_providers:
- api_mode: chat_completions
  base_url: http://127.0.0.1:4001/v1
  key_env: EXIOM_LITELLM_MASTER_KEY
  model: g2-sonnet
  models:
    g2-haiku: {}
    g2-sonnet: {}
  name: ExiomClaude
mcp_servers:
  context7:
    enabled: true
    url: https://mcp.context7.com/mcp
  filesystem:
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - /home/naca/pemrograman/virtual office agent
    - /home/naca/pemrograman/exiom-web
    command: npx
    enabled: true
  gmail:
    args:
    - -y
    - '@gongrzhe/server-gmail-autoauth-mcp'
    command: npx
    enabled: true
    env:
      GMAIL_CREDENTIALS_PATH: ${GDRIVE_OAUTH_CLIENT_PATH}
  playwright:
    args:
    - -y
    - '@playwright/mcp@latest'
    - --headless
    command: npx
    enabled: true
  postgres:
    args:
    - -y
    - '@modelcontextprotocol/server-postgres'
    - ${EXIOM_DB_URL}
    command: npx
    enabled: true
  searxng:
    args:
    - -y
    - '@modelcontextprotocol/server-fetch'
    command: npx
    enabled: true
    env:
      SEARXNG_URL: http://localhost:8080
model:
  api_key: sk-exiom-business-proxy
  api_mode: chat_completions
  base_url: http://127.0.0.1:4001/v1
  default: g2-sonnet
  provider: custom
