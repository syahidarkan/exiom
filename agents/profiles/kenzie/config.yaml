_config_version: 50
advertised_toolsets:
- terminal
- file
- code_execution
- kanban
- todo
- a2a
- web
- memory
- delegation
- cronjob
custom_providers:
- api_mode: chat_completions
  base_url: http://127.0.0.1:4001/v1
  key_env: EXIOM_LITELLM_MASTER_KEY
  model: g1-sonnet
  models:
    g1-haiku: {}
    g1-sonnet: {}
  name: ExiomClaude
mcp_servers:
  context7:
    enabled: true
    url: https://mcp.context7.com/mcp
  filesystem:
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - /home/naca/pemrograman/virtual office agent
    - /home/naca/pemrograman/hermes-virtual-office
    - /home/naca/pemrograman/exiom-web
    command: npx
    enabled: true
  github:
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    command: npx
    enabled: true
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
  gmail:
    args:
    - -y
    - '@gongrzhe/server-gmail-autoauth-mcp'
    command: npx
    enabled: true
    env:
      GMAIL_CREDENTIALS_PATH: ${GDRIVE_OAUTH_CLIENT_PATH}
  notion:
    auth: oauth
    enabled: true
    url: https://mcp.notion.com/mcp
  playwright:
    args:
    - -y
    - '@playwright/mcp@latest'
    - --headless
    command: npx
    enabled: true
  postgres:
    args:
    - -y
    - '@modelcontextprotocol/server-postgres'
    - ${EXIOM_DB_URL}
    command: npx
    enabled: true
model:
  api_key: sk-exiom-business-proxy
  api_mode: chat_completions
  base_url: http://127.0.0.1:4001/v1
  default: g1-sonnet
  provider: custom
